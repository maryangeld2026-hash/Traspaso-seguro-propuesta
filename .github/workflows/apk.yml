name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Construir la app web y copiarla al proyecto Android
        run: python3 web/construir.py

      - name: Preparar la clave de firma (si existe el secreto)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p android/keystore
            echo "$KEYSTORE_B64" | base64 -d > android/keystore/traspaso.jks
            echo "Se firmará con la clave propia."
          else
            echo "No hay secreto KEYSTORE_B64: se firmará con una clave de depuración temporal."
          fi

      - name: Compilar
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Nombrar el APK
        run: |
          mkdir -p salida
          cp android/app/build/outputs/apk/release/app-release.apk "salida/TraspasoSeguro-v1.0.${{ github.run_number }}.apk"
          ls -la salida

      - uses: actions/upload-artifact@v4
        with:
          name: TraspasoSeguro-apk
          path: salida/*.apk

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Traspaso seguro v1.0.${{ github.run_number }}
          make_latest: true
          files: salida/*.apk
          body: |
            APK de Traspaso seguro para Android 8 o superior.

            **Cómo instalarlo:** descarga el archivo `.apk` desde el celular, ábrelo y, si Android lo pide, permite "Instalar apps desconocidas" para tu navegador.
